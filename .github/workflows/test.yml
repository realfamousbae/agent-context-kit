name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show shells
        shell: bash
        run: |
          git --version
          ls -l "$(command -v sh)" || true
          bash --version | head -n 1
          git config --show-origin --get core.autocrlf || true
      - name: Tests under sh (dash on Ubuntu, bash 3.2 on macOS, Git Bash on Windows)
        shell: bash
        run: sh tests/run.sh
      - name: Tests under bash
        if: runner.os == 'Linux'
        shell: bash
        run: TEST_SH=bash sh tests/run.sh
      - name: Wrappers from PowerShell 7 and cmd
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows/wrappers.ps1
      - name: Wrappers from Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows/wrappers.ps1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (POSIX sh)
        run: |
          shellcheck --version | head -n 2
          shellcheck -S warning -s sh -x $(git ls-files 'template/.context/bin/ctx' 'template/.context/bin/*.sh' \
            'template/.context/bin/cmd/*.sh' 'template/.githooks/*' 'tests/*.sh' '*.sh')
